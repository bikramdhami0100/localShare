services:
  postgres:
    image: postgres:16-alpine
    container_name: localshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localshare
      POSTGRES_PASSWORD: localshare
      POSTGRES_DB: localshare
    ports:
      # The application server runs on the host and reaches Postgres here.
      - "5432:5432"
    volumes:
      - localshare_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localshare -d localshare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localshare_pgdata: